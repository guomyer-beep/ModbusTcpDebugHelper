<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModbusTCP 设备调试助手</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>ModbusTCP 设备调试助手</h1>
        <span id="status-badge" class="badge off">未连接</span>
    </header>

    <div id="msg" class="msg hidden"></div>

    <main>
        <!-- 连接设备 -->
        <section class="card">
            <h2>① 连接设备</h2>
            <div class="form-row">
                <label>从站 IP</label>
                <input id="host" type="text" placeholder="192.168.18.126">
            </div>
            <div class="form-row">
                <label>端口</label>
                <input id="port" type="number" value="502">
            </div>
            <div class="btn-row">
                <button id="btn-connect" class="primary">连接</button>
                <button id="btn-disconnect">断开</button>
            </div>
        </section>

        <!-- 读保持寄存器 -->
        <section class="card">
            <h2>② 读取保持寄存器 (FC03)</h2>
            <div class="form-row">
                <label>起始地址(1起始)</label>
                <input id="read-addr" type="number" value="1">
                <label>数量</label>
                <input id="read-qty" type="number" value="5" style="width:90px">
            </div>
            <div class="btn-row">
                <button id="btn-read" class="primary">读取</button>
            </div>
            <table id="reg-table">
                <thead><tr><th>地址</th><th>十进制</th><th>十六进制</th></tr></thead>
                <tbody><tr><td colspan="3">暂无数据</td></tr></tbody>
            </table>
        </section>

        <!-- 写单寄存器 -->
        <section class="card">
            <h2>③ 写入单寄存器 (FC06)</h2>
            <div class="form-row">
                <label>地址(1起始)</label>
                <input id="write-addr" type="number" value="1">
                <label>数值</label>
                <input id="write-value" type="number" value="0">
            </div>
            <div class="btn-row">
                <button id="btn-write" class="primary">写入</button>
            </div>
        </section>

        <!-- 本次报文 -->
        <section class="card">
            <h2>④ 本次报文</h2>
            <div class="packet">
                <span class="tag tx">TX 请求</span>
                <pre id="tx-hex">(无)</pre>
            </div>
            <div class="packet">
                <span class="tag rx">RX 响应</span>
                <pre id="rx-hex">(无)</pre>
            </div>
        </section>

        <!-- 日志 -->
        <section class="card wide">
            <h2>⑤ 日志</h2>
            <div class="toolbar">
                <div class="tabs">
                    <button class="tab active" data-tab="packets">报文</button>
                    <button class="tab" data-tab="registers">寄存器</button>
                    <button class="tab" data-tab="connections">连接</button>
                </div>
                <div class="btn-row">
                    <button id="btn-refresh-log">刷新</button>
                    <button id="btn-clear-log">清空报文</button>
                </div>
            </div>
            <div id="log-list" class="log-list"></div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
